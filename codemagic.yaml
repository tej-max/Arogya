workflows:
  android-workflow:
    name: Arogya Android APK
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      java: 17

    scripts:
      - name: Check Android project files
        script: |
          echo "Checking Android project structure..."
          if [ ! -f settings.gradle.kts ] && [ ! -f settings.gradle ]; then
            echo "ERROR: Gradle settings file missing."
            exit 1
          fi
          if [ ! -d app ]; then
            echo "ERROR: app folder missing."
            exit 1
          fi
          if [ ! -f app/build.gradle.kts ] && [ ! -f app/build.gradle ]; then
            echo "ERROR: App Gradle file missing."
            exit 1
          fi

      - name: Build Debug APK
        script: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

    artifacts:
      - app/build/outputs/apk/debug/*.apk
